name: Validar app (testes, typecheck, lint e build)

# =============================================================================
# Verificação de TODA mudança de código, sem filtro de caminho.
#
# POR QUE ESTE WORKFLOW EXISTE, SEPARADO DE validar-banco.yml
#   Os testes de domínio, o typecheck, o lint e o build moravam dentro do
#   `validar-banco.yml`, que só dispara quando a mudança toca `supabase/**`.
#   Consequência: um PR puramente de TypeScript — a maioria deles — não rodava
#   verificação nenhuma. Os PRs #13 e #14 passaram exatamente assim, com o
#   Vercel como único check; a garantia veio de rodar tudo na mão. Um teste
#   quebrado por uma mudança de front entraria sem ninguém perceber.
#
#   Aqui não há `paths:` de propósito: qualquer push ou PR passa por estas
#   verificações. As duas checagens de banco continuam em `validar-banco.yml`,
#   filtradas por `supabase/**`, porque sobem um Postgres e só fazem sentido
#   quando o esquema muda.
#
# SEGURANÇA
#   Não usa secret nenhum. As variáveis do build são placeholders fictícios: o
#   build do Next não conecta no Supabase, só exige que as variáveis existam.
# =============================================================================

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Job-level `if:` não pode referenciar `secrets.*` diretamente (GitHub Actions
# recusa o workflow inteiro nesse caso — é assim que a autoativação do job
# e2e-autenticado, logo abaixo, quebrou o parse em todo evento `push` até essa
# correção). O padrão documentado é indireto: variável de ambiente no nível do
# workflow, e o `if:` do job lê essa variável, nunca o secret em si.
env:
  E2E_DEMO_PASSWORD_DEFINIDA: ${{ secrets.E2E_DEMO_PASSWORD != '' }}

# Um push novo no mesmo branch cancela a execução anterior, que já ficou
# obsoleta — evita fila de runs concorrentes no mesmo código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    name: Testes, typecheck, lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Testes de domínio
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # Placeholders: o build do Next não conecta no Supabase, mas as libs
        # exigem que as variáveis existam. Valores fictícios de propósito —
        # nenhuma credencial real entra neste workflow.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-de-ci
          SUPABASE_SERVICE_ROLE_KEY: chave-ficticia-de-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # ===========================================================================
  # E2E público (Playwright) — roda em paralelo ao job acima, não depende dele.
  #
  # Escopo desta fase: só as páginas públicas (/, /login, /privacidade,
  # /termos) e os CTAs da landing — os specs de e2e/. Nenhum teste autenticado,
  # nenhum tenant demo, nenhum Supabase real. As mesmas env fictícias do job
  # de build acima bastam, porque nenhuma dessas rotas consulta o Supabase na
  # renderização (o login só toca a Auth ao SUBMETER o formulário, e estes
  # testes não submetem).
  #
  # Só Chromium, de propósito: cobre "botão não funciona", "âncora errada",
  # "overflow" — problemas de estrutura/layout, não de engine de renderização.
  # ===========================================================================
  e2e-publico:
    name: E2E público (Playwright · Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E públicos
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-de-ci
          SUPABASE_SERVICE_ROLE_KEY: chave-ficticia-de-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload do relatório (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ===========================================================================
  # E2E autenticado (Playwright) — fase 3: login → painel → treinos →
  # "Gerenciar acesso" → modal, só no tenant de DEMONSTRAÇÃO (is_demo=true,
  # slug "demonstracao"). Só leitura/navegação: nenhum dado é criado, editado
  # ou excluído. Nunca usa a service_role key.
  #
  # AUTOATIVAÇÃO: este job só roda quando o secret E2E_DEMO_PASSWORD existir
  # (condição no nível do job). Enquanto não existir, ele aparece como
  # "skipped" — nunca como falha — e some da lista assim que o secret for
  # cadastrado, sem precisar tocar neste arquivo de novo.
  #
  # Secrets necessários (nenhum é a service_role):
  #   E2E_DEMO_PASSWORD          — senha de demo@gestacad.com.br
  #   NEXT_PUBLIC_SUPABASE_URL   — mesma URL pública já usada pelo app
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY — mesma anon key pública já usada pelo app
  # (as duas últimas não são segredo por natureza — já vão no bundle do
  # cliente em produção — mas entram como secret aqui só para não expor o
  # projeto Supabase de referência diretamente no YAML público do repo.)
  # ===========================================================================
  e2e-autenticado:
    name: E2E autenticado (Playwright · Chromium · tenant demo)
    runs-on: ubuntu-latest
    if: ${{ env.E2E_DEMO_PASSWORD_DEFINIDA == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Teste E2E autenticado (tenant demo)
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          E2E_DEMO_EMAIL: demo@gestacad.com.br
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
        run: npm run test:e2e:auth

      - name: Upload do relatório (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          retention-days: 7

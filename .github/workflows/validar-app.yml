name: Validar app (testes, typecheck, lint e build)

# =============================================================================
# Verificação de TODA mudança de código, sem filtro de caminho.
#
# POR QUE ESTE WORKFLOW EXISTE, SEPARADO DE validar-banco.yml
#   Os testes de domínio, o typecheck, o lint e o build moravam dentro do
#   `validar-banco.yml`, que só dispara quando a mudança toca `supabase/**`.
#   Consequência: um PR puramente de TypeScript — a maioria deles — não rodava
#   verificação nenhuma. Os PRs #13 e #14 passaram exatamente assim, com o
#   Vercel como único check; a garantia veio de rodar tudo na mão. Um teste
#   quebrado por uma mudança de front entraria sem ninguém perceber.
#
#   Aqui não há `paths:` de propósito: qualquer push ou PR passa por estas
#   verificações. As duas checagens de banco continuam em `validar-banco.yml`,
#   filtradas por `supabase/**`, porque sobem um Postgres e só fazem sentido
#   quando o esquema muda.
#
# SEGURANÇA
#   Não usa secret nenhum. As variáveis do build são placeholders fictícios: o
#   build do Next não conecta no Supabase, só exige que as variáveis existam.
# =============================================================================

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Um push novo no mesmo branch cancela a execução anterior, que já ficou
# obsoleta — evita fila de runs concorrentes no mesmo código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    name: Testes, typecheck, lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Testes de domínio
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # Placeholders: o build do Next não conecta no Supabase, mas as libs
        # exigem que as variáveis existam. Valores fictícios de propósito —
        # nenhuma credencial real entra neste workflow.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-de-ci
          SUPABASE_SERVICE_ROLE_KEY: chave-ficticia-de-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # ===========================================================================
  # E2E público (Playwright) — roda em paralelo ao job acima, não depende dele.
  #
  # Escopo desta fase: só as páginas públicas (/, /login, /privacidade,
  # /termos) e os CTAs da landing — os specs de e2e/. Nenhum teste autenticado,
  # nenhum tenant demo, nenhum Supabase real. As mesmas env fictícias do job
  # de build acima bastam, porque nenhuma dessas rotas consulta o Supabase na
  # renderização (o login só toca a Auth ao SUBMETER o formulário, e estes
  # testes não submetem).
  #
  # Só Chromium, de propósito: cobre "botão não funciona", "âncora errada",
  # "overflow" — problemas de estrutura/layout, não de engine de renderização.
  # ===========================================================================
  e2e-publico:
    name: E2E público (Playwright · Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E públicos
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-de-ci
          SUPABASE_SERVICE_ROLE_KEY: chave-ficticia-de-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload do relatório (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ===========================================================================
  # E2E autenticado (Playwright) — fase 3: login → painel → treinos →
  # "Gerenciar acesso" → modal, no tenant de DEMONSTRAÇÃO (is_demo=true, slug
  # "demonstracao"). Só leitura/navegação: nenhum dado real é tocado.
  #
  # SEM SECRET, SEM PROJETO HOSPEDADO — igual à filosofia do validar-banco.yml.
  # O plano Free do Supabase já usa seus 2 projetos, então este job sobe a
  # STACK LOCAL do Supabase (Postgres + Auth/GoTrue + PostgREST + Storage) via
  # a CLI, dentro do próprio runner, com chaves de desenvolvimento fixas e
  # públicas (as mesmas de qualquer `supabase start`). É hermético e descartável.
  #
  # Fluxo:
  #   1. `supabase start` num diretório temporário (migrations vazias) → sobe a
  #      stack com um Postgres limpo, mas com os schemas reais `auth`/`storage`.
  #   2. Aplica supabase/schema.sql + as migrations via psql (mesma seleção do
  #      validar-banco.yml). NÃO roda o 00_bootstrap.sql: ele finge os objetos
  #      do Supabase para um Postgres cru; aqui os reais já existem (e ele
  #      sobrescreveria auth.uid()).
  #   3. Semeia o tenant demo com scripts/criar-demo.mjs (cria a academia, o
  #      usuário demo@gestacad.com.br na Auth e os dados de demonstração).
  #   4. Roda test:e2e:auth: o Playwright faz login de verdade contra a Auth
  #      local e navega pelo painel.
  # ===========================================================================
  e2e-autenticado:
    name: E2E autenticado (Playwright · Chromium · tenant demo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (não 20 como os outros jobs): o @supabase/supabase-js usado
          # pelo criar-demo exige um WebSocket global, que só existe a partir do
          # Node 22 ("native WebSocket not found" no Node 20).
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir a stack local do Supabase (Postgres + Auth + Storage)
        run: |
          set -euo pipefail
          # Projeto da CLI num diretório temporário e com migrations VAZIAS, para
          # a CLI subir um banco limpo em vez de tentar aplicar as nossas (que
          # dependem do schema.sql como baseline e excluem rollbacks/seeds demo).
          mkdir -p "$RUNNER_TEMP/sb"
          cd "$RUNNER_TEMP/sb"
          supabase init --force
          supabase start

      - name: Exportar as credenciais locais do Supabase
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sb"
          # `-o env` imprime API_URL / DB_URL / ANON_KEY / SERVICE_ROLE_KEY.
          # São chaves de desenvolvimento públicas e fixas — não são segredo.
          supabase status -o env > status.env
          set -a; . ./status.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SB_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Aplicar schema + migrations no Postgres local
        run: |
          set -euo pipefail
          # Baseline (não existe migration 001), depois as migrations em ordem
          # numérica — mesma seleção do validar-banco.yml: fora rollbacks e os
          # seeds de demonstração (que exigem uma academia pré-existente).
          psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          for arquivo in $(ls supabase/migrations/*.sql | grep -vE '(_rollback|_dados_demo)\.sql$' | sort); do
            echo "── $(basename "$arquivo")"
            psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done
          # PostgREST cacheia o schema ao subir (quando ainda estava vazio);
          # recarrega para enxergar as tabelas recém-criadas.
          psql "$SB_DB_URL" -c "notify pgrst, 'reload schema';"
          sleep 5

      - name: Semear o tenant de demonstração
        env:
          DEMO_SENHA: e2e-demo-senha-ci
        # NEXT_PUBLIC_SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY vêm do env do job
        # (passo anterior). criar-demo cria a academia, o usuário Auth demo e os
        # dados de demonstração.
        run: npm run criar-demo

      - name: Teste E2E autenticado (tenant demo local)
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          E2E_DEMO_EMAIL: demo@gestacad.com.br
          E2E_DEMO_PASSWORD: e2e-demo-senha-ci
        # As NEXT_PUBLIC_* e a service role vêm do env do job (assadas no build
        # do Next pelo webServer do Playwright).
        run: npm run test:e2e:auth

      - name: Upload do relatório (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          retention-days: 7
